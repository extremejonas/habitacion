<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Asistente de la pieza</title>
<style>
:root { --bg:#eef1f4; --surface:#fff; --ink:#141b22; --soft:#5a6773; --line:#d5dce3; --accent:#2458e6; --on:#fff; --live:#e5484d; --ok:#1f8a4c; }
@media (prefers-color-scheme: dark) { :root { --bg:#0f1418; --surface:#182027; --ink:#e9eef3; --soft:#92a0ac; --line:#2a353f; --accent:#6f93ff; --on:#0b1220; --live:#ff6b70; --ok:#4cc27f; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
main { max-width: 520px; margin: 0 auto; }
h1 { font-size: 22px; margin: 4px 0 2px; }
.sub { color: var(--soft); margin: 0 0 14px; font-size: 15px; }
#orb { display:block; width:128px; height:128px; border-radius:50%; border:0; margin: 18px auto 8px; background:var(--accent); color:var(--on); font: 600 16px system-ui; cursor:pointer; }
#orb.on { background: var(--ok); color:#fff; }
#orb.awake { background: var(--live); color:#fff; }
#status { text-align:center; font-weight:600; min-height: 27px; }
#heard { text-align:center; color:var(--soft); min-height: 24px; overflow-wrap:anywhere; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:14px; }
label { display:block; font-size:14px; color:var(--soft); margin-top:10px; }
input, select { width:100%; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
summary { cursor:pointer; font-weight:600; }
#log { list-style:none; padding:0; margin:0; }
#log li { padding:8px 0; border-bottom:1px solid var(--line); overflow-wrap:anywhere; font-size:15px; }
#log li:last-child { border:0; }
#log .me { color:var(--soft); }
.err { color: var(--live); }
button:focus-visible, input:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Asistente de la pieza</h1>
  <p class="sub">Decí la frase de activación y después tu pedido. Ejemplo: “oye pieza, subí el volumen”.</p>

  <button id="orb" type="button">Empezar</button>
  <div id="status" role="status">Apagado</div>
  <div id="heard"></div>

  <details class="card" id="cfg" open>
    <summary>Ajustes</summary>
    <label for="prov">Cerebro</label>
    <select id="prov">
      <option value="groq">Groq (más rápido)</option>
      <option value="gemini">Gemini (Google)</option>
    </select>
    <label for="stt">Reconocimiento de voz</label>
    <select id="stt">
      <option value="whisper">Whisper de Groq (anda en Brave)</option>
      <option value="browser">Del navegador (solo Chrome)</option>
    </select>
    <label for="key">Clave de la API (se guarda solo en este celu)</label>
    <input id="key" type="password" autocomplete="off" placeholder="Pegá tu clave acá">
    <label for="keyg">Clave de Groq para entender la voz (solo si el cerebro es Gemini)</label>
    <input id="keyg" type="password" autocomplete="off" placeholder="Opcional">
    <label for="model">Modelo (si da error, probá cambiarlo)</label>
    <input id="model" type="text" autocomplete="off">
    <label for="wake">Frase de activación</label>
    <input id="wake" type="text" autocomplete="off" value="oye pieza">
    <label for="esp">Dirección del ESP32 (dejá vacío mientras no llegue)</label>
    <input id="esp" type="text" autocomplete="off" placeholder="http://pieza.local">
  </details>

  <div class="card"><ul id="log"></ul></div>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ALLOWED = {
    gadnic: ['power', 'mode', 'mute', 'vol-', 'vol+', 'play'],
    proy: ['power', 'source', 'menu', 'up', 'down', 'left', 'right', 'ok', 'back', 'focus'],
    box: ['up', 'down', 'left', 'right', 'ok', 'back', 'home', 'play']
  };
  const RELES = ['luz1', 'luz2'];
  const DEFAULT_MODEL = { groq: 'llama-3.1-8b-instant', gemini: 'gemini-2.5-flash' };
  const SYSTEM = `Sos el asistente de voz de la pieza del usuario (argentino, hablás en español rioplatense, tono cálido y directo, respuestas de una o dos frases cortas y sin símbolos, porque se leen en voz alta).
Respondé SIEMPRE un JSON con esta forma exacta: {"say":"lo que decís en voz alta","actions":[]}.
En "actions" podés pedir acciones sobre la casa. Solo estas son válidas:
- {"type":"ir","dev":"gadnic","cmd":"power|mode|mute|vol-|vol+|play"} (equipo de música; "mode" cambia entre Bluetooth y AUX)
- {"type":"ir","dev":"proy","cmd":"power|source|menu|up|down|left|right|ok|back|focus"} (proyector)
- {"type":"ir","dev":"box","cmd":"up|down|left|right|ok|back|home|play"} (TV box)
- {"type":"rele","id":"luz1|luz2","on":true|false} (luces de la pieza)
Si el pedido es una charla o una pregunta, dejá "actions" vacío. No inventes acciones ni dispositivos, y no hagas nada sobre el auto ni sobre otras casas. Si no entendés, pedí que lo repita. Para subir o bajar mucho el volumen podés mandar varias acciones iguales (máximo 5).`;

  const store = (k, v) => { try { if (v === undefined) return localStorage.getItem('asis-' + k); localStorage.setItem('asis-' + k, v); } catch (e) {} return null; };
  for (const id of ['prov', 'stt', 'key', 'keyg', 'model', 'wake', 'esp']) {
    const el = $(id), v = store(id); if (v !== null) el.value = v;
    el.addEventListener('change', () => { store(id, el.value); if (id === 'prov' && !store('model')) $('model').value = DEFAULT_MODEL[el.value]; });
  }
  if (!$('model').value) $('model').value = DEFAULT_MODEL[$('prov').value];
  $('prov').addEventListener('change', () => { $('model').value = DEFAULT_MODEL[$('prov').value]; store('model', $('model').value); });

  const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const status = (t, cls) => { $('status').textContent = t; $('orb').className = cls || (running ? 'on' : ''); };
  function log(who, text, err) {
    const li = document.createElement('li'); li.className = err ? 'err' : (who === 'yo' ? 'me' : '');
    li.textContent = (who ? who + ': ' : '') + text;
    $('log').prepend(li); while ($('log').children.length > 30) $('log').lastChild.remove();
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, running = false, busy = false, awakeUntil = 0, wakeLock = null;
  const history = [];

  function speak(text) {
    return new Promise((res) => {
      if (!window.speechSynthesis || !text) return res();
      try {
        const u = new SpeechSynthesisUtterance(text), vs = speechSynthesis.getVoices();
        const v = vs.find(x => x.lang === 'es-AR') || vs.find(x => x.lang.startsWith('es'));
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'es-AR';
        u.onend = res; u.onerror = res; speechSynthesis.cancel(); speechSynthesis.speak(u);
      } catch (e) { res(); }
    });
  }

  async function askBrain(text) {
    const key = $('key').value.trim(), model = $('model').value.trim() || DEFAULT_MODEL[$('prov').value];
    if (!key) throw new Error('Falta pegar la clave de la API en Ajustes.');
    history.push({ role: 'user', content: text }); while (history.length > 8) history.shift();
    let raw;
    if ($('prov').value === 'groq') {
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
        body: JSON.stringify({ model, temperature: 0.4, max_tokens: 300, response_format: { type: 'json_object' },
          messages: [{ role: 'system', content: SYSTEM }, ...history] })
      });
      const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || 'Error ' + r.status);
      raw = j.choices[0].message.content;
    } else {
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ systemInstruction: { parts: [{ text: SYSTEM }] },
          contents: history.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })),
          generationConfig: { responseMimeType: 'application/json', temperature: 0.4, maxOutputTokens: 300 } })
      });
      const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || 'Error ' + r.status);
      raw = j.candidates[0].content.parts.map(p => p.text || '').join('');
    }
    history.push({ role: 'assistant', content: raw });
    try { const o = JSON.parse(raw); return { say: String(o.say || ''), actions: Array.isArray(o.actions) ? o.actions.slice(0, 5) : [] }; }
    catch (e) { return { say: raw.slice(0, 200), actions: [] }; }
  }

  async function runAction(a) {
    let path = null, label = '';
    if (a && a.type === 'ir' && ALLOWED[a.dev] && ALLOWED[a.dev].includes(a.cmd)) { path = '/ir?dev=' + a.dev + '&cmd=' + encodeURIComponent(a.cmd); label = a.dev + ' ' + a.cmd; }
    else if (a && a.type === 'rele' && RELES.includes(a.id)) { path = '/rele?id=' + a.id + '&on=' + (a.on ? 1 : 0); label = a.id + (a.on ? ' encender' : ' apagar'); }
    else { log('', 'Acción ignorada (no válida).', true); return; }
    const esp = $('esp').value.trim().replace(/\/$/, '');
    if (!esp) { log('', '[modo prueba] ' + label); return; }
    try { await fetch(esp + path, { mode: 'no-cors' }); log('', '→ ' + label); }
    catch (e) { log('', 'No pude hablar con el ESP32 (' + label + ').', true); }
  }

  async function ask(text) {
    busy = true; log('yo', text); status('Pensando…', 'awake');
    try {
      const out = await askBrain(text);
      for (const a of out.actions) await runAction(a);
      log('asistente', out.say); status('Hablando…', 'awake');
      await speak(out.say);
    } catch (e) { log('', e.message || 'Error', true); status('Error', 'on'); }
    busy = false; awakeUntil = Date.now() + 6000; if (running) status('Escuchando…');
  }

  function handle(text) {
    if (busy) return;
    const wake = norm($('wake').value.trim()), n = norm(text), i = wake ? n.indexOf(wake) : -1;
    if (i >= 0) {
      const cmd = text.slice(i + wake.length).replace(/^[\s,.:;!¡¿?-]+/, '');
      if (cmd.length > 2) ask(cmd); else { awakeUntil = Date.now() + 8000; status('Te escucho…', 'awake'); }
    } else if (Date.now() < awakeUntil) ask(text);
  }

  function startRec() {
    rec = new SR(); rec.lang = 'es-AR'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = (e) => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i], t = r[0].transcript.trim();
        if (!r.isFinal) { $('heard').textContent = '“' + t + '”'; continue; }
        $('heard').textContent = '“' + t + '”'; handle(t);
      }
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { running = false; status('Micrófono bloqueado', ''); log('', 'Permití el micrófono para esta página y tocá Empezar.', true); }
      else if (e.error === 'network') log('', 'El reconocimiento de voz necesita internet.', true);
    };
    rec.onend = () => { if (running) setTimeout(() => { try { rec.start(); } catch (e) {} }, 300); };
    try { rec.start(); } catch (e) {}
  }

  async function keepAwake() {
    try { if (navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') keepAwake(); });

  /* ---------- Oído por Whisper (anda en Brave): graba lo que hablás y lo transcribe ---------- */
  let mic = null, ctx = null, proc = null, src = null, transcribing = false;

  function wavFrom(chunks, inRate) {
    let len = 0; chunks.forEach(c => { len += c.length; });
    const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
    const ratio = inRate / 16000, n = Math.floor(all.length / ratio), pcm = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      let sum = 0, cnt = 0; const from = Math.floor(i * ratio), to = Math.min(all.length, Math.floor((i + 1) * ratio));
      for (let j = from; j < to; j++) { sum += all[j]; cnt++; }
      const x = Math.max(-1, Math.min(1, cnt ? sum / cnt : 0)); pcm[i] = x < 0 ? x * 0x8000 : x * 0x7fff;
    }
    const buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    const w = (off, str) => { for (let i = 0; i < str.length; i++) v.setUint8(off + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 16000, true); v.setUint32(28, 32000, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
    new Int16Array(buf, 44).set(pcm);
    return new Blob([buf], { type: 'audio/wav' });
  }

  async function transcribe(blob) {
    const key = $('prov').value === 'groq' ? $('key').value.trim() : $('keyg').value.trim();
    if (!key) throw new Error('Falta la clave de Groq para entender la voz (en Ajustes).');
    const fd = new FormData();
    fd.append('file', blob, 'voz.wav'); fd.append('model', 'whisper-large-v3-turbo'); fd.append('language', 'es'); fd.append('temperature', '0');
    fd.append('prompt', $('wake').value.trim() + '. Pedidos para la casa: subí el volumen, bajá el volumen, apagá la luz, prendé el proyector.');
    const r = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', { method: 'POST', headers: { Authorization: 'Bearer ' + key }, body: fd });
    const j = await r.json(); if (!r.ok) throw new Error((j.error && j.error.message) || 'Error ' + r.status);
    return (j.text || '').trim();
  }

  async function onUtterance(chunks) {
    if (transcribing || busy) return;
    transcribing = true;
    try {
      const t = await transcribe(wavFrom(chunks, ctx.sampleRate));
      if (t.length > 1 && !/^(gracias\.?|subt[ií]tulos|suscr[ií]be)/i.test(t)) { $('heard').textContent = '“' + t + '”'; handle(t); }
    } catch (e) { log('', e.message || 'Error al entender la voz', true); }
    transcribing = false;
  }

  async function startWhisper() {
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ctx = new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
    src = ctx.createMediaStreamSource(mic); proc = ctx.createScriptProcessor(2048, 1, 1);
    let ring = [], utter = [], speaking = false, loud = 0, lastLoud = 0, startT = 0, floor = 0.005;
    proc.onaudioprocess = (e) => {
      const d = new Float32Array(e.inputBuffer.getChannelData(0));
      let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
      const rms = Math.sqrt(s / d.length), now = performance.now(), thr = Math.max(0.012, floor * 3);
      if (!speaking) {
        floor = floor * 0.98 + rms * 0.02;
        ring.push(d); if (ring.length > 10) ring.shift();
        if (rms > thr && !busy && !transcribing) { speaking = true; utter = ring.slice(); ring = []; loud = 1; lastLoud = now; startT = now; }
      } else {
        utter.push(d);
        if (rms > thr) { loud++; lastLoud = now; }
        if (now - lastLoud > 900 || now - startT > 14000) {
          speaking = false; const chunks = utter; utter = [];
          if (loud >= 5 && !busy) onUtterance(chunks);
        }
      }
    };
    src.connect(proc); proc.connect(ctx.destination);
  }
  function stopWhisper() {
    try { proc && proc.disconnect(); src && src.disconnect(); } catch (e) {}
    try { mic && mic.getTracks().forEach(t => t.stop()); } catch (e) {}
    try { ctx && ctx.close(); } catch (e) {}
    proc = src = mic = ctx = null;
  }

  function begin() { running = true; $('orb').textContent = 'Parar'; $('cfg').open = false; keepAwake(); status('Escuchando…'); log('', 'Decí: “' + $('wake').value + '” y después tu pedido.'); }
  $('orb').addEventListener('click', () => {
    if (running) {
      running = false; try { rec && rec.stop(); } catch (e) {} stopWhisper();
      try { wakeLock && wakeLock.release(); } catch (e) {} status('Apagado', ''); $('orb').textContent = 'Empezar'; return;
    }
    if ($('stt').value === 'browser') {
      if (!SR) { log('', 'Este navegador no tiene reconocimiento de voz. Usá Whisper en Ajustes.', true); return; }
      begin(); startRec(); return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { log('', 'Este navegador no deja usar el micrófono desde esta dirección. Hace falta abrir la página desde un archivo guardado o con HTTPS.', true); return; }
    startWhisper().then(begin).catch((e) => {
      status('Micrófono bloqueado', '');
      log('', e && e.name === 'NotAllowedError' ? 'Permití el micrófono para esta página y tocá Empezar.' : 'No pude abrir el micrófono: ' + (e && e.message), true);
    });
  });
})();
</script>
</body>
</html>
