<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Asta-IA</title>
<style>
:root{--bg:#0f1418;--surface:#182027;--ink:#e9eef3;--soft:#92a0ac;--line:#2a353f;--accent:#6f93ff;--on:#0b1220;--live:#ff6b70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 16px;font-size:15px}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14px;color:var(--soft)}
.row input{width:20px;height:20px;accent-color:var(--accent)}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:12px;padding:13px;width:100%;cursor:pointer;background:var(--accent);color:var(--on)}
button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-bottom:12px}
button.link{background:none;color:var(--soft);font-weight:400;font-size:14px;text-decoration:underline;margin-top:12px;padding:4px}
button[hidden]{display:none}
button:disabled{opacity:.6}
#msg{min-height:24px;margin-top:10px;color:var(--live);font-size:14px}
#msg.ok{color:var(--soft)}
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <h1>Asta-IA <small style="font-size:13px;color:var(--accent);font-weight:700;">v1.17</small></h1>
    <button type="button" onclick="location.replace(location.pathname+'?v='+Date.now())" style="width:auto;padding:6px 10px;font-size:13px;border-radius:9px;background:var(--bg);color:var(--soft);border:1px solid var(--line);">🔄 Actualizar</button>
  </div>
  <p class="sub">Ingresá tu clave para continuar.</p>
  <button id="fp" class="alt" type="button" hidden>Desbloquear con huella</button>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave">
    <label class="row" id="remrow" hidden><input type="checkbox" id="rem" checked><span>Recordar en este celu (después pide huella)</span></label>
    <button id="go" type="submit">Entrar</button>
  </form>
  <div id="msg" role="alert"></div>
  <button id="forget" class="link" type="button" hidden>Olvidar este celu</button>
</main>

    e.preventDefault(); const pw = $('pw').value; if (!pw) { msg('Escribí tu clave.'); return; }
    $('go').disabled = true; msg('Verificando…', true); let key;
    try { key = await deriveKey(pw); await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.i) }, key, b64d(P.c)); }
    catch (err) { await new Promise(r => setTimeout(r, 800)); $('go').disabled = false; msg('Clave incorrecta.'); return; }
    if ($('rem').checked && !$('remrow').hidden) {
      if (hasNativeBio()) { try { window.AndroidBridge.saveBiometricSecret(JSON.stringify({ sid: P.s, pw })); } catch (err) {} }
      else { try { await makeFingerprint(key); } catch (err) {} }
    }
    try { await open(key); } catch (err) { $('go').disabled = false; msg('No se pudo abrir. Probá de nuevo.'); }
  });
  $('forget').addEventListener('click', async () => {
    await clearRec();
    try { if (window.AndroidBridge && window.AndroidBridge.clearBiometricSecret) window.AndroidBridge.clearBiometricSecret(); } catch (e) {}
    $('fp').hidden = true; $('forget').hidden = true;
    msg('Listo: este celu ya no recuerda la clave.', true);
  });
  (async () => {
    if (!window.crypto || !crypto.subtle) { msg('Hace falta HTTPS.'); $('go').disabled = true; return; }
    if (hasNativeBio()) {
      $('remrow').hidden = false;
      let hasSec = false;
      try { hasSec = !!window.AndroidBridge.hasBiometricSecret(); } catch (e) {}
      if (hasSec) {
        $('fp').hidden = false; $('forget').hidden = false;
        $('fp').addEventListener('click', () => tryNativeFingerprint());
        tryNativeFingerprint();
      }
      return;
    }
    if (await canFingerprint()) $('remrow').hidden = false;
    const rec = await loadRec();
    if (rec && rec.sid === P.s && rec.key && rec.cid) {
      $('fp').hidden = false; $('forget').hidden = false;
      $('fp').addEventListener('click', () => tryFingerprint(rec));
      tryFingerprint(rec);
    } else if (rec) { clearRec(); }
  })();
})();
</script>
