<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Asta-IA</title>
<style>
:root{--bg:#0f1418;--surface:#182027;--ink:#e9eef3;--soft:#92a0ac;--line:#2a353f;--accent:#6f93ff;--on:#0b1220;--live:#ff6b70;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
main{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 16px;font-size:15px}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;margin:12px 0;font-size:14px;color:var(--soft)}
.row input{width:20px;height:20px;accent-color:var(--accent)}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:12px;padding:13px;width:100%;cursor:pointer;background:var(--accent);color:var(--on)}
button.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-bottom:12px}
button.link{background:none;color:var(--soft);font-weight:400;font-size:14px;text-decoration:underline;margin-top:12px;padding:4px}
button[hidden]{display:none}
button:disabled{opacity:.6}
#msg{min-height:24px;margin-top:10px;color:var(--live);font-size:14px}
#msg.ok{color:var(--soft)}
</style>
</head>
<body>
<main>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
    <h1>Asta-IA <small style="font-size:13px;color:var(--accent);font-weight:700;">v1.13</small></h1>
    <button type="button" onclick="location.replace(location.pathname+'?v='+Date.now())" style="width:auto;padding:6px 10px;font-size:13px;border-radius:9px;background:var(--bg);color:var(--soft);border:1px solid var(--line);">🔄 Actualizar</button>
  </div>
  <p class="sub">Ingresá tu clave para continuar.</p>
  <button id="fp" class="alt" type="button" hidden>Desbloquear con huella</button>
  <form id="f">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Clave" aria-label="Clave">
    <label class="row" id="remrow" hidden><input type="checkbox" id="rem" checked><span>Recordar en este celu (después pide huella)</span></label>
    <button id="go" type="submit">Entrar</button>
  </form>
  <div id="msg" role="alert"></div>
  <button id="forget" class="link" type="button" hidden>Olvidar este celu</button>
</main>

  const $ = (id) => document.getElementById(id);
  const enc = new TextEncoder(), dec = new TextDecoder();
  const b64d = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const b64e = (u) => btoa(String.fromCharCode(...new Uint8Array(u)));
  const msg = (t, ok) => { $('msg').textContent = t; $('msg').className = ok ? 'ok' : ''; };
  const db = () => new Promise((res, rej) => { const r = indexedDB.open('pieza-lock', 1); r.onupgradeneeded = () => r.result.createObjectStore('k'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const idb = async (mode, fn) => { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('k', mode), s = t.objectStore('k'), q = fn(s); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  const saveRec = (rec) => idb('readwrite', s => s.put(rec, 'rec')).catch(() => {});
  const loadRec = () => idb('readonly', s => s.get('rec')).catch(() => null);
  const clearRec = () => idb('readwrite', s => s.delete('rec')).catch(() => {});
  const canFingerprint = async () => { try { return !!(window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } };
  async function deriveKey(pw) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(P.s), iterations: P.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  }
  async function open(key) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.i) }, key, b64d(P.c));
    document.open(); document.write(dec.decode(plain)); document.close();
  }
  async function makeFingerprint(key) {
    const cred = await navigator.credentials.create({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), rp: { name: 'Pieza Inteligente' }, user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'pieza', displayName: 'Pieza' }, pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000 } });

    try { await navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), allowCredentials: [{ type: 'public-key', id: b64d(rec.cid) }], userVerification: 'required', timeout: 60000 } }); }

  }
  const hasNativeBio = () => { try { return !!(window.AndroidBridge && window.AndroidBridge.hasBiometric && window.AndroidBridge.hasBiometric()); } catch (e) { return false; } };
  function tryNativeFingerprint() {
    if (!hasNativeBio()) return;
    window.__onNativeBio = async (raw) => {
      if (!raw) return;
      let obj = null;
      try { obj = JSON.parse(raw); } catch (e) {}
      if (!obj || obj.sid !== P.s || !obj.pw) {
        try { window.AndroidBridge.clearBiometricSecret(); } catch (e) {}
        $('fp').hidden = true; $('forget').hidden = true;
        msg('Cambió la clave. Ingresala de nuevo.');
        return;
      }
      $('go').disabled = true; msg('Desbloqueando…', true);
      try {
        const key = await deriveKey(obj.pw);
        await open(key);
      } catch (e) {
        try { window.AndroidBridge.clearBiometricSecret(); } catch (err) {}
        $('go').disabled = false; $('fp').hidden = true; $('forget').hidden = true;
        msg('Cambió la clave. Ingresala de nuevo.');
      }
    };
    try { window.AndroidBridge.unlockWithBiometric('__onNativeBio'); } catch (e) {}
  }
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault(); const pw = $('pw').value; if (!pw) { msg('Escribí tu clave.'); return; }

    try { key = await deriveKey(pw); await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.i) }, key, b64d(P.c)); }

    try { if (window.AndroidBridge && window.AndroidBridge.clearBiometricSecret) window.AndroidBridge.clearBiometricSecret(); } catch (e) {}

        $('fp').addEventListener('click', () => tryNativeFingerprint());
